<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-right" id="loginSpace">
        <button class="login-button" onclick="openLogin()">Login</button>
    </div>

    <div class="heading">
        <span>🎥</span>
        <h1>Movie Recommendation</h1>
        <span>📽️</span>
    </div>

    <div class="recommend-form" id="formSection">
        <form id="movieForm">
            <label>Select Genre</label>
            <select id="genre" required>
                <option value="">Choose Genre</option>
                <option value="Action">Action</option>
                <option value="Adventure">Adventure</option>
                <option value="Animation">Animation</option>
                <option value="Comedy">Comedy</option>
                <option value="Crime">Crime</option>
                <option value="Documentary">Documentary</option>
                <option value="Drama">Drama</option>
                <option value="Family">Family</option>
                <option value="Fantasy">Fantasy</option>
                <option value="History">History</option>
                <option value="Horror">Horror</option>
                <option value="Music">Music</option>
                <option value="Mystery">Mystery</option>
                <option value="Romance">Romance</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Thriller">Thriller</option>
                <option value="War">War</option>
                <option value="Western">Western</option>
            </select>

            <label>Select Language</label>
            <select id="language" required>
                <option value="">Choose Language</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
                <option value="ja">Japanese</option>
                <option value="it">Italian</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
            </select>

            <label>Sort By</label>
            <select id="sortBy" required>
                <option value="">Choose Criteria</option>
                <option value="popularity">Popularity</option>
                <option value="vote_average">IMDb Rating</option>
                <option value="revenue">Box Office Revenue</option>
            </select>

            <label>Select Minimum IMDb Rating</label>
            <select id="rating" required>
                <option value="">Choose Rating</option>
                <option value="5">5+</option>
                <option value="6">6+</option>
                <option value="7">7+</option>
                <option value="8">8+</option>
                <option value="9">9+</option>
            </select>

            <button type="submit">Find Best Movies</button>
        </form>
    </div>

    <div id="resultSection" class="result-box" style="display:none;">
        <h1>Recommended Movies</h1>
        <ul id="movieList"></ul>
    </div>

    <div class="login-popup" id="loginPopup">
        <div class="login-container">
            <span class="close-btn" onclick="closeLogin()">&times;</span>
            <h1>Login</h1>
            <form id="authForm">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter Email" required>

                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter Password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        function openLogin(){
            document.getElementById("loginPopup").style.display = "flex";
        }
        function closeLogin(){
            document.getElementById("loginPopup").style.display = "none";
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
